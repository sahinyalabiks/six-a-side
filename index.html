<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d3527">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Six-a-Side</title>
<style>
html,body{height:100%;margin:0;background:#0d3527;overflow:hidden;touch-action:manipulation;overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:"Avenir Next Condensed","Roboto Condensed","Arial Narrow",system-ui,-apple-system,Roboto,sans-serif;color:#fff}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#ui{pointer-events:none}
#touch{position:fixed;inset:0;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:center;pointer-events:none;
  padding-top:max(8px,env(safe-area-inset-top))}
#score{display:flex;align-items:center;gap:10px;background:rgba(8,20,16,.72);border-radius:999px;padding:6px 16px;
  font-weight:800;font-size:17px;letter-spacing:.08em;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#score i{width:11px;height:11px;border-radius:50%;display:inline-block}
#score b{font-size:22px;min-width:16px;text-align:center;font-variant-numeric:tabular-nums}
#score .sep{opacity:.45}
#clock{margin-left:8px;padding-left:12px;border-left:1px solid rgba(255,255,255,.22);font-variant-numeric:tabular-nums;opacity:.9}
#banner{position:fixed;left:0;right:0;top:50%;transform:translateY(-58%);text-align:center;pointer-events:none;opacity:0}
#banner .slab{display:inline-block;padding:4px 44px 8px;transform:skewX(-12deg);background:var(--c,#111)}
#banner .main{font-weight:900;font-style:italic;font-size:min(19vh,96px);line-height:1;letter-spacing:.02em;
  transform:skewX(12deg);display:block;text-shadow:0 4px 0 rgba(0,0,0,.25)}
#banner .sub{display:block;margin-top:10px;font-weight:800;font-style:italic;font-size:min(5.5vh,26px);letter-spacing:.22em;
  text-shadow:0 2px 8px rgba(0,0,0,.6)}
#banner.show{animation:ban 2.4s cubic-bezier(.2,.9,.2,1) both}
@keyframes ban{0%{opacity:0;transform:translate(-40%,-58%) scale(.9)}12%{opacity:1;transform:translate(1.5%,-58%) scale(1.04)}
  20%{transform:translate(0,-58%) scale(1)}80%{opacity:1;transform:translate(-1%,-58%)}100%{opacity:0;transform:translate(40%,-58%)}}
#toast{position:fixed;left:0;right:0;top:22%;text-align:center;pointer-events:none;opacity:0;
  font-weight:900;font-style:italic;font-size:min(8vh,40px);letter-spacing:.1em;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 18px rgba(0,0,0,.4)}
#toast.show{animation:tst 1.3s cubic-bezier(.2,.9,.2,1) both}
@keyframes tst{0%{opacity:0;transform:scale(1.5)}14%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(6,22,17,.55),rgba(6,22,17,.9));text-align:center;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#menu.hide{display:none}
#menu h1{margin:0;font-weight:900;font-style:italic;font-size:min(18vh,84px);letter-spacing:.02em;line-height:1}
#menu h1 em{font-style:inherit;color:#ff2f4f}
#menu h2{margin:8px 0 0;font-weight:800;font-size:min(6vh,26px);letter-spacing:.2em;opacity:.92}
#how{display:flex;gap:min(5vw,44px);margin-top:min(6vh,28px);font-weight:700;font-size:min(4vh,15px);letter-spacing:.14em;opacity:.8}
#how span b{display:block;font-size:1.25em;color:#fff;opacity:1;margin-bottom:3px}
#go{margin-top:min(7vh,34px);font-weight:900;font-style:italic;font-size:min(6.5vh,28px);letter-spacing:.2em;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
#rotate{position:fixed;inset:0;background:#0d3527;display:none;align-items:center;justify-content:center;
  font-weight:900;font-style:italic;font-size:26px;letter-spacing:.16em;text-align:center}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ui"></canvas>
<div id="touch"></div>
<div id="hud"><div id="score">
  <i style="background:#ff2f4f"></i><span>YOU</span><b id="s0">0</b><span class="sep">:</span><b id="s1">0</b><span>CPU</span><i style="background:#2b6cff"></i>
  <span id="clock">3:00</span></div></div>
<div id="banner"><span class="slab"><span class="main" id="bmain">GOAL!</span></span><span class="sub" id="bsub"></span></div>
<div id="toast"></div>
<div id="menu">
  <h1 id="mtitle">SIX<em>·</em>A<em>·</em>SIDE</h1>
  <h2 id="msub">NO THROW-INS. NO FOULS. JUST FOOTBALL.</h2>
  <div id="how">
    <span><b>LEFT THUMB</b>MOVE</span>
    <span><b>TAP</b>PASS · TACKLE</span>
    <span><b>SWIPE</b>SHOOT</span>
    <span><b>DRAW A CURVE</b>BEND IT</span>
  </div>
  <div id="go">TAP TO KICK OFF</div>
</div>
<div id="rotate">ROTATE YOUR PHONE<br>TO LANDSCAPE</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
/* ---------- constants ---------- */
const W=40,L=62,HW=W/2,HL=L/2,GW=10,GH=3,BR=0.42,GRAV=26,MATCH=180,STEP=1/120;
const COL=[{main:0xff2f4f,css:'#ff2f4f',shorts:0xffffff,gk:0xffc21a,name:'YOU'},
           {main:0x2b6cff,css:'#2b6cff',shorts:0x0f1e4d,gk:0x14d6c0,name:'CPU'}];
const clamp=(v,a,b)=>v<a?a:v>b?b:v, hyp=Math.hypot, PI=Math.PI;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const $=id=>document.getElementById(id);

/* ---------- renderer / scene ---------- */
const renderer=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true,powerPreference:'high-performance'});
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.setClearColor(0x0d3527);
const scene=new THREE.Scene();
const VFOV=32,PHI=64*PI/180;
const cam=new THREE.PerspectiveCamera(VFOV,1,1,400);
scene.add(new THREE.HemisphereLight(0xffffff,0x6f9a84,0.62));
const sun=new THREE.DirectionalLight(0xffffff,0.5);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
{const c=sun.shadow.camera;c.left=-34;c.right=34;c.top=34;c.bottom=-34;c.near=1;c.far=110;sun.shadow.bias=-0.0006;sun.shadow.normalBias=0.04;}
scene.add(sun,sun.target);

function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t;}

/* pitch */
{
  const s=24;
  const tex=canvasTex(W*s,L*s,(g,w,h)=>{
    const n=10;for(let i=0;i<n;i++){g.fillStyle=i%2?'#2f9f58':'#2a9450';g.fillRect(0,i*h/n,w,h/n+1);}
    g.strokeStyle='rgba(255,255,255,.9)';g.fillStyle='rgba(255,255,255,.9)';g.lineWidth=0.2*s;
    const lw=g.lineWidth/2;
    g.strokeRect(lw,lw,w-2*lw,h-2*lw);
    g.beginPath();g.moveTo(0,h/2);g.lineTo(w,h/2);g.stroke();
    g.beginPath();g.arc(w/2,h/2,5*s,0,7);g.stroke();
    g.beginPath();g.arc(w/2,h/2,0.3*s,0,7);g.fill();
    for(const e of [0,1]){
      const y=e?h:0,d=e?-1:1;
      g.strokeRect(w/2-11*s,e?h-9*s:0,22*s,9*s);
      g.strokeRect(w/2-7*s,e?h-3.5*s:0,14*s,3.5*s);
      g.beginPath();g.arc(w/2,y+d*7*s,0.25*s,0,7);g.fill();
      g.beginPath();g.arc(w/2,y+d*7*s,4.2*s,e?PI+0.5:0.5,e?2*PI-0.5:PI-0.5);g.stroke();
    }
  });
  const m=new THREE.Mesh(new THREE.PlaneGeometry(W,L),new THREE.MeshLambertMaterial({map:tex}));
  m.rotation.x=-PI/2;m.receiveShadow=true;scene.add(m);
  const o=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshLambertMaterial({color:0x165a3f}));
  o.rotation.x=-PI/2;o.position.y=-0.02;o.receiveShadow=true;scene.add(o);
  // boards
  const bm=new THREE.MeshLambertMaterial({color:0xeef2f6});
  const board=(x,z,sx,sz)=>{const b=new THREE.Mesh(new THREE.BoxGeometry(sx,0.8,sz),bm);b.position.set(x,0.4,z);b.castShadow=b.receiveShadow=true;scene.add(b);};
  board(-HW-0.35,0,0.3,L+1);board(HW+0.35,0,0.3,L+1);
  const seg=(HW+0.5-GW/2-0.15);
  for(const z of [-HL-0.35,HL+0.35])for(const sx of [-1,1])board(sx*(GW/2+0.15+seg/2),z,seg,0.3);
  // goals
  const pm=new THREE.MeshLambertMaterial({color:0xffffff});
  const netTex=canvasTex(64,64,(g)=>{g.clearRect(0,0,64,64);g.strokeStyle='rgba(255,255,255,.95)';g.lineWidth=5;g.strokeRect(0,0,64,64);});
  netTex.wrapS=netTex.wrapT=THREE.RepeatWrapping;
  const netM=(rx,ry)=>{const t=netTex.clone();t.needsUpdate=true;t.repeat.set(rx,ry);return new THREE.MeshBasicMaterial({map:t,transparent:true,opacity:.5,side:THREE.DoubleSide,depthWrite:false});};
  for(const s2 of [-1,1]){
    const z=s2*HL,D=2.2;
    for(const sx of [-1,1]){
      const p=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,GH,10),pm);p.position.set(sx*GW/2,GH/2,z);p.castShadow=true;scene.add(p);
      const sd=new THREE.Mesh(new THREE.PlaneGeometry(D,GH),netM(4,6));sd.rotation.y=PI/2;sd.position.set(sx*GW/2,GH/2,z+s2*D/2);scene.add(sd);
    }
    const bar=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.13,GW+0.26,10),pm);bar.rotation.z=PI/2;bar.position.set(0,GH,z);bar.castShadow=true;scene.add(bar);
    const back=new THREE.Mesh(new THREE.PlaneGeometry(GW,GH),netM(20,6));back.position.set(0,GH/2,z+s2*D);scene.add(back);
    const top=new THREE.Mesh(new THREE.PlaneGeometry(GW,D),netM(20,4));top.rotation.x=PI/2;top.position.set(0,GH,z+s2*D/2);scene.add(top);
  }
}

/* ---------- entities ---------- */
const teams=[{dir:-1,players:[],score:0,chaser:null},{dir:1,players:[],score:0,chaser:null}];
const HOME=[[0,-0.94],[-0.5,-0.5],[0.5,-0.5],[0,-0.1],[-0.45,0.38],[0.45,0.38]];
const MAXF=[0,0.25,0.25,0.7,0.9,0.9];
const players=[];
const G={torso:new THREE.CylinderGeometry(0.4,0.5,1.0,14),sh:new THREE.SphereGeometry(0.42,14,10),
  shorts:new THREE.CylinderGeometry(0.5,0.44,0.4,14),head:new THREE.SphereGeometry(0.3,14,10),
  hair:new THREE.SphereGeometry(0.32,12,8,0,PI*2,0,PI*0.5),foot:new THREE.SphereGeometry(0.19,8,6)};
const skin=[0xf2c9a0,0xe0ac7e,0x9c6b43,0x6b4428],hairC=[0x2a1c12,0x111111,0x8a5a2b,0xd9b25f];
function makePlayer(team,idx){
  const C=COL[team],T=teams[team];
  const g=new THREE.Group(),inner=new THREE.Group();g.add(inner);
  const mat=new THREE.MeshLambertMaterial({color:idx===0?C.gk:C.main});
  const add=(geo,m,x,y,z,par=inner)=>{const o=new THREE.Mesh(geo,m);o.position.set(x,y,z);o.castShadow=true;par.add(o);return o;};
  add(G.torso,mat,0,1.05,0);
  add(G.sh,mat,0,1.52,0).scale.set(1.35,0.55,0.95);
  add(G.shorts,new THREE.MeshLambertMaterial({color:C.shorts}),0,0.5,0);
  add(G.head,new THREE.MeshLambertMaterial({color:skin[(idx+team*2)%4]}),0,1.98,0);
  add(G.hair,new THREE.MeshLambertMaterial({color:hairC[(idx*3+team)%4]}),0,2.0,-0.03);
  const fm=new THREE.MeshLambertMaterial({color:0x1a1a1a});
  const fl=add(G.foot,fm,-0.24,0.18,0,g),fr=add(G.foot,fm,0.24,0.18,0,g);
  g.scale.setScalar(1.15);scene.add(g);
  const hu=team===0;
  const p={team,idx,gk:idx===0,hx:HOME[idx][0],hf:HOME[idx][1],x:0,z:0,vx:0,vz:0,fx:0,fz:T.dir,dx:0,dz:0,
    run:hu?8.3:7.7,drib:hu?7.9:7.1,dive:hu?10.5:9.2,stun:0,kickCd:0,protect:0,slide:0,slideCd:0,sdx:0,sdz:0,down:0,
    phase:rnd(6),think:rnd(.2),hold:0,g,inner,fl,fr};
  T.players.push(p);players.push(p);
}
for(let t=0;t<2;t++)for(let i=0;i<6;i++)makePlayer(t,i);

const ball={x:0,y:BR,z:0,vx:0,vy:0,vz:0,owner:null,lastKicker:null,lock:0,after:null,shot:null};
ball.mesh=new THREE.Mesh(new THREE.SphereGeometry(BR,20,14),new THREE.MeshLambertMaterial({map:canvasTex(128,64,(g)=>{
  g.fillStyle='#fff';g.fillRect(0,0,128,64);g.fillStyle='#1c1c22';
  for(let i=0;i<8;i++){g.beginPath();g.arc(8+i*16,(i%2?20:44),6.5,0,7);g.fill();}})}));
ball.mesh.castShadow=true;scene.add(ball.mesh);

const ring=new THREE.Mesh(new THREE.RingGeometry(0.82,1.05,36),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.9,depthWrite:false}));
ring.rotation.x=-PI/2;ring.position.y=0.04;scene.add(ring);

/* particles */
const dotTex=canvasTex(32,32,(g)=>{g.fillStyle='#fff';g.beginPath();g.arc(16,16,15,0,7);g.fill();});
const parts=[];let pIdx=0;
for(let i=0;i<150;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:dotTex,transparent:true,depthWrite:false}));s.visible=false;scene.add(s);
  parts.push({s,life:0,max:1,vx:0,vy:0,vz:0,g:0,size:1});}
function spawn(x,y,z,vx,vy,vz,life,size,color,g=0){const p=parts[pIdx=(pIdx+1)%parts.length];
  p.s.position.set(x,y,z);p.vx=vx;p.vy=vy;p.vz=vz;p.life=p.max=life;p.size=size;p.g=g;p.s.material.color.setHex(color);p.s.visible=true;}
function puff(x,y,z,color,n,sp){for(let i=0;i<n;i++){const a=rnd(PI*2),v=rnd(.3,1)*sp;spawn(x,y,z,Math.cos(a)*v,rnd(.5,2.5),Math.sin(a)*v,rnd(.25,.5),rnd(.25,.5),color,6);}}
const shocks=[];for(let i=0;i<4;i++){const m=new THREE.Mesh(new THREE.RingGeometry(0.85,1,32),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,depthWrite:false}));
  m.rotation.x=-PI/2;m.position.y=0.05;m.visible=false;scene.add(m);shocks.push({m,t:0});}
let shI=0;function shock(x,z){const s=shocks[shI=(shI+1)%4];s.m.position.x=x;s.m.position.z=z;s.t=0.35;s.m.visible=true;}

/* ---------- audio ---------- */
let AC=null,master,crowdG,noiseBuf;
function initAudio(){
  if(AC){AC.resume&&AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=0.85;master.connect(AC.destination);
    const len=AC.sampleRate*3;const buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);let l=0;
    for(let i=0;i<len;i++){l=(l+0.02*(Math.random()*2-1))/1.02;d[i]=l*3.5;}
    for(let i=0;i<2000;i++){const k=i/2000;d[len-2000+i]=d[len-2000+i]*(1-k)+d[i]*k;}
    const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
    const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=650;bp.Q.value=0.5;
    crowdG=AC.createGain();crowdG.gain.value=0.06;src.connect(bp);bp.connect(crowdG);crowdG.connect(master);src.start();
    noiseBuf=AC.createBuffer(1,AC.sampleRate*0.3,AC.sampleRate);const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  }catch(e){AC=null;}
}
function crowd(level,dur=2.5){if(!AC)return;const t=AC.currentTime,g=crowdG.gain;g.cancelScheduledValues(t);g.setValueAtTime(g.value,t);
  g.linearRampToValueAtTime(level,t+0.15);g.linearRampToValueAtTime(0.06,t+dur);}
function tone(type,f0,f1,dur,vol,delay=0){if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02);}
function noise(dur,vol,freq){if(!AC)return;const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;f.type='lowpass';f.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+0.02);}
const sfx={
  kick:p=>{tone('sine',180,50,0.13,0.25+0.45*p);noise(0.05,0.12+0.25*p,2200);},
  bounce:()=>tone('sine',120,60,0.07,0.14),
  thud:()=>{tone('sine',140,70,0.09,0.25);noise(0.05,0.12,900);},
  post:()=>{tone('triangle',880,850,0.4,0.3);tone('sine',1330,1300,0.3,0.14);},
  tackle:()=>noise(0.09,0.3,1000),
  whistle:(n=1)=>{for(let i=0;i<n;i++){tone('sine',2250,2250,0.3,0.1,i*0.4);tone('sine',2390,2390,0.3,0.1,i*0.4);}},
};
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}};

/* ---------- announcements ---------- */
function banner(main,sub,color){const b=$('banner');$('bmain').textContent=main;$('bsub').textContent=sub||'';
  b.style.setProperty('--c',color||'#10241c');b.classList.remove('show');void b.offsetWidth;b.classList.add('show');}
let toastT=0;
function toast(txt){if(time-toastT<0.6)return;toastT=time;const t=$('toast');t.textContent=txt;t.classList.remove('show');void t.offsetWidth;t.classList.add('show');}

/* ---------- game state ---------- */
let state='menu',time=0,matchT=MATCH,goalT=0,slow=0,shake=0,active=null,forced=null,forcedT=0,pending=null,lastScorer=0,focus=0;
const stick={x:0,y:0,id:null,ox:0,oy:0,px:0,py:0};
const keys={};
let gesture=null,ghost=null;

const inBox=(x,z,team)=>Math.abs(x)<11&&Math.abs(z+teams[team].dir*HL)<9;
function ballAt(t,out){const k=ball.y>BR+0.05?0.25:0.9,f=(1-Math.exp(-k*t))/k;
  out.x=clamp(ball.x+ball.vx*f,-HW+BR,HW-BR);out.z=clamp(ball.z+ball.vz*f,-HL+BR,HL-BR);return out;}
const _b={x:0,z:0};
function interceptTime(p){
  if(ball.owner)return hyp(p.x-ball.x,p.z-ball.z)/p.run;
  for(let t=0;t<=2.5;t+=0.1){ballAt(t,_b);if(hyp(_b.x-p.x,_b.z-p.z)-0.9<=p.run*t)return t;}
  ballAt(2.5,_b);return 2.5+hyp(_b.x-p.x,_b.z-p.z)/p.run;
}
function interceptPoint(p,out){
  for(let t=0;t<=2.5;t+=0.1){ballAt(t,out);if(hyp(out.x-p.x,out.z-p.z)-0.9<=p.run*t)return out;}
  return ballAt(2.5,out);
}
function go(p,tx,tz,sp,slowR=1.2){const dx=tx-p.x,dz=tz-p.z,d=hyp(dx,dz);if(d<0.12){p.dx=p.dz=0;return;}
  const s=sp*Math.min(1,d/slowR);p.dx=dx/d*s;p.dz=dz/d*s;}
function laneBlocked(ax,az,bx,bz,team){
  const dx=bx-ax,dz=bz-az,l2=dx*dx+dz*dz||1;
  for(const o of teams[1-team].players){const t=clamp(((o.x-ax)*dx+(o.z-az)*dz)/l2,0,1);

    let a=pts[i-1];const b=pts[i];let sl=hyp(b.x-a.x,b.y-a.y);
    while(acc+sl>=stepL&&rs.length<N){const k=(stepL-acc)/sl;a={x:a.x+(b.x-a.x)*k,y:a.y+(b.y-a.y)*k};rs.push(a);sl=hyp(b.x-a.x,b.y-a.y);acc=0;}

      const d=hyp(p.x-b.x,p.z-b.z);
      if(p.slide>0){if(d<1.3&&b.y<1.2){b.vx=p.sdx*15;b.vz=p.sdz*15;b.vy=2;b.lastKicker=p;b.lock=0.3;b.after=null;b.shot=null;sfx.kick(0.4);}continue;}
      const box=p.gk&&inBox(p.x,p.z,p.team);
      if(d<(box?1.45:1.12)&&b.y<(box?2.8:1.35)&&d<bd){bd=d;best=p;bbox=box;}
    }
    if(best)capture(best,bbox);
  }else{
    const o=b.owner;
    if(o.protect<=0&&!(o.gk&&inBox(o.x,o.z,o.team))){
      for(const p of teams[1-o.team].players){
        if(p.down>0||p.stun>0)continue;const d=hyp(p.x-b.x,p.z-b.z);
        if(p.slide>0){if(d<1.35){o.stun=0.7;b.owner=null;b.vx=p.sdx*12+rnd(-2,2);b.vz=p.sdz*12+rnd(-2,2);b.vy=1.5;b.lastKicker=p;b.lock=0.25;
          puff(b.x,0.3,b.z,0xffffff,6,4);sfx.thud();if(p.team===0)toast('TACKLE!');break;}}
        else if(d<0.95&&Math.random()<dt*7){o.stun=0.45;sfx.tackle();setOwner(p);p.protect=0.6;break;}
      }
    }
  }
}
function step(dt){
  time+=dt;
  if(state==='play'){matchT-=dt;if(matchT<=0){matchT=0;fullTime();}}
  if(state==='goal'){goalT-=dt;if(goalT<=0){resetKickoff(1-lastScorer);state='play';sfx.whistle(1);}}
  updateRoles(dt);
  for(const p of players)think(p,dt);
  for(const p of players){
    if(p.slide>0){p.slide-=dt;const sp=13*(0.45+0.55*Math.max(p.slide,0)/0.32);p.vx=p.sdx*sp;p.vz=p.sdz*sp;if(p.slide<=0)p.down=0.42;}
    else if(p.down>0){p.down-=dt;p.vx*=0.85;p.vz*=0.85;}
    else{const m=p.stun>0?0.3:1,k=Math.min(1,dt*11);p.vx+=(p.dx*m-p.vx)*k;p.vz+=(p.dz*m-p.vz)*k;}
    p.x=clamp(p.x+p.vx*dt,-HW+0.4,HW-0.4);p.z=clamp(p.z+p.vz*dt,-HL+0.4,HL-0.4);
    const sp=hyp(p.vx,p.vz);p.phase+=sp*dt*1.5;
    if(sp>0.7&&p.slide<=0&&p.down<=0&&p.kickCd<=0){const k=Math.min(1,dt*14);p.fx+=(p.vx/sp-p.fx)*k;p.fz+=(p.vz/sp-p.fz)*k;const n=hyp(p.fx,p.fz);if(n>0.01){p.fx/=n;p.fz/=n;}else{p.fx=p.vx/sp;p.fz=p.vz/sp;}}
    if(p.stun>0)p.stun-=dt;if(p.kickCd>0)p.kickCd-=dt;if(p.protect>0)p.protect-=dt;if(p.slideCd>0)p.slideCd-=dt;
  }
  for(let i=0;i<players.length;i++)for(let j=i+1;j<players.length;j++){const a=players[i],c=players[j];if(a.slide>0||c.slide>0)continue;
    const dx=c.x-a.x,dz=c.z-a.z,d=hyp(dx,dz);if(d<1.0&&d>0.001){const k=(1.0-d)/d*0.5;a.x-=dx*k;a.z-=dz*k;c.x+=dx*k;c.z+=dz*k;}}
  ballStep(dt);
  if(state==='play')interactions(dt);
}
function fullTime(){
  state='over';sfx.whistle(3);crowd(0.3,4);
  const a=teams[0].score,b=teams[1].score;
  $('mtitle').innerHTML=a>b?'YOU <em>WIN</em>':a<b?'DEFEAT':'DRAW';
  $('msub').textContent='FULL TIME  ·  '+a+' – '+b;$('how').style.display='none';$('go').textContent='TAP TO PLAY AGAIN';
  overAt=performance.now();$('menu').classList.remove('hide');
}
let overAt=0;

/* ---------- input ---------- */
const touch=$('touch');
touch.addEventListener('pointerdown',e=>{
  e.preventDefault();try{touch.setPointerCapture(e.pointerId);}catch(_){}
  if(e.clientX<innerWidth*0.45){if(stick.id===null){stick.id=e.pointerId;stick.ox=stick.px=e.clientX;stick.oy=stick.py=e.clientY;stick.x=stick.y=0;}}
  else if(!gesture)gesture={id:e.pointerId,pts:[{x:e.clientX,y:e.clientY}],t:performance.now()};
});
touch.addEventListener('pointermove',e=>{
  if(e.pointerId===stick.id){const R=52;let dx=e.clientX-stick.ox,dy=e.clientY-stick.oy;const d=hyp(dx,dy);
    if(d>R){stick.ox+=dx*(d-R)/d;stick.oy+=dy*(d-R)/d;dx=dx/d*R;dy=dy/d*R;}
    stick.px=e.clientX;stick.py=e.clientY;stick.x=dx/R;stick.y=dy/R;}
  else if(gesture&&e.pointerId===gesture.id){const l=gesture.pts[gesture.pts.length-1];
    if(hyp(e.clientX-l.x,e.clientY-l.y)>3)gesture.pts.push({x:e.clientX,y:e.clientY});}
});
const up=e=>{
  if(e.pointerId===stick.id){stick.id=null;stick.x=stick.y=0;}
  else if(gesture&&e.pointerId===gesture.id){const g=gesture;gesture=null;ghost={pts:g.pts,t:0.45};doGesture(g.pts);}
};
touch.addEventListener('pointerup',up);touch.addEventListener('pointercancel',up);
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' '){doGesture([{x:0,y:0}]);e.preventDefault();}});
addEventListener('keyup',e=>{keys[e.key]=false;});
addEventListener('contextmenu',e=>e.preventDefault());
$('menu').addEventListener('pointerup',()=>{
  if(state==='over'&&performance.now()-overAt<1200)return;
  initAudio();
  $('mtitle').innerHTML='SIX<em>·</em>A<em>·</em>SIDE';startMatch();
});

/* ---------- camera / resize ---------- */
const ui=$('ui'),ux=ui.getContext('2d');
let camH=30,offC=15,fMin=0,fMax=0,dpr=1;
function resize(){
  const w=innerWidth,h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);
  renderer.setPixelRatio(dpr);renderer.setSize(w,h,false);
  ui.width=w*dpr;ui.height=h*dpr;
  cam.aspect=w/h;cam.updateProjectionMatrix();
  const vf=VFOV*PI/360;
  camH=(HW+1.3)/(Math.tan(vf)*cam.aspect)*Math.sin(PHI+vf)/Math.cos(vf);
  offC=camH/Math.tan(PHI);
  const offB=camH/Math.tan(PHI+vf),offT=camH/Math.tan(PHI-vf);
  fMax=HL+3.2-(offC-offB);fMin=-HL-5-(offC-offT);
  if(fMin>fMax)fMin=fMax=(fMin+fMax)/2;
}
addEventListener('resize',resize);resize();

/* ---------- render ---------- */
const _ax=new THREE.Vector3();
function render(rdt,sdt){
  for(const p of players){
    const g=p.g,sp=hyp(p.vx,p.vz);
    let hop=0;if(state==='goal'&&p.team===lastScorer)hop=Math.abs(Math.sin(time*9+p.idx))*0.7;
    g.position.set(p.x,hop,p.z);g.rotation.y=Math.atan2(p.fx,p.fz);
    const lying=p.slide>0||p.down>0;
    p.inner.rotation.x+=((lying?-1.15:sp/8*0.28)-p.inner.rotation.x)*Math.min(1,rdt*16);
    p.inner.position.y+=((lying?-0.25:Math.abs(Math.sin(p.phase))*0.07*Math.min(1,sp/4))-p.inner.position.y)*Math.min(1,rdt*16);
    const a=Math.min(1,sp/4)*0.38;p.fl.position.z=lying?0.6:Math.sin(p.phase)*a;p.fr.position.z=lying?0.75:-Math.sin(p.phase)*a;
  }
  const b=ball,bs=hyp(b.vx,b.vz);
  b.mesh.position.set(b.x,b.y,b.z);
  if(bs>0.2){_ax.set(b.vz,0,-b.vx).normalize();b.mesh.rotateOnWorldAxis(_ax,bs*sdt/BR);}
  if(!b.owner&&bs>15&&state!=='menu'){const c=b.after?COL[b.lastKicker?b.lastKicker.team:0].main:0xffffff;
    spawn(b.x,b.y,b.z,0,0,0,b.after?0.5:0.22,b.after?0.55:0.42,c,0);}
  if(active&&state!=='menu'){ring.visible=true;ring.position.x=active.x;ring.position.z=active.z;
    ring.scale.setScalar(1+Math.sin(time*7)*0.05);ring.material.opacity=b.owner===active?1:0.7;}else ring.visible=false;
  for(const p of parts){if(p.life<=0)continue;p.life-=sdt;if(p.life<=0){p.s.visible=false;continue;}
    p.vy-=p.g*sdt;const s=p.s.position;s.x+=p.vx*sdt;s.y+=p.vy*sdt;s.z+=p.vz*sdt;if(s.y<0.1){s.y=0.1;p.vy*=-0.3;p.vx*=0.6;p.vz*=0.6;}
    const k=p.life/p.max;p.s.material.opacity=Math.min(1,k*1.6);p.s.scale.setScalar(p.size*(p.g?1:k));}
  for(const s of shocks){if(s.t<=0)continue;s.t-=sdt;if(s.t<=0){s.m.visible=false;continue;}const k=1-s.t/0.35;s.m.scale.setScalar(0.6+k*3);s.m.material.opacity=(1-k)*0.8;}
  // camera
  const tf=clamp(b.z+clamp(b.vz*0.22,-3,3),fMin,fMax);
  focus+=(tf-focus)*Math.min(1,rdt*4.5);
  shake=Math.max(0,shake-rdt*1.6);
  const sx=(Math.random()-.5)*shake*1.4,sz=(Math.random()-.5)*shake*1.4;
  cam.position.set(sx,camH,focus+offC+sz);cam.lookAt(sx,0,focus+sz);
  sun.position.set(-10,34,focus-13);sun.target.position.set(0,0,focus);
  renderer.render(scene,cam);
  // overlay
  ux.setTransform(dpr,0,0,dpr,0,0);ux.clearRect(0,0,innerWidth,innerHeight);ux.lineCap=ux.lineJoin='round';
  if(stick.id!==null){
    ux.strokeStyle='rgba(255,255,255,.35)';ux.lineWidth=3;ux.beginPath();ux.arc(stick.ox,stick.oy,52,0,7);ux.stroke();
    ux.fillStyle='rgba(255,255,255,.75)';ux.beginPath();ux.arc(stick.ox+stick.x*52,stick.oy+stick.y*52,24,0,7);ux.fill();
  }
  const drawStroke=(pts,al)=>{
    if(pts.length<2)return;let len=0;const H=Math.min(innerWidth,innerHeight);
    for(let i=1;i<pts.length;i++){const a=pts[i-1],c=pts[i];len+=hyp(c.x-a.x,c.y-a.y);
      const pw=clamp(len/(0.55*H),0,1);
      ux.strokeStyle=`hsla(${50-50*pw},100%,${92-32*pw}%,${al})`;ux.lineWidth=5+pw*9;
      ux.beginPath();ux.moveTo(a.x,a.y);ux.lineTo(c.x,c.y);ux.stroke();}
    const e=pts[pts.length-1];ux.fillStyle=`rgba(255,255,255,${al})`;ux.beginPath();ux.arc(e.x,e.y,9,0,7);ux.fill();
  };
  if(gesture)drawStroke(gesture.pts,0.9);
  if(ghost){ghost.t-=rdt;if(ghost.t<=0)ghost=null;else drawStroke(ghost.pts,ghost.t/0.45*0.8);}
  const m=Math.ceil(matchT);$('clock').textContent=(m/60|0)+':'+String(m%60).padStart(2,'0');
}
let last=performance.now(),acc=0;
function frame(now){
  const rdt=Math.min(0.05,(now-last)/1000);last=now;
  let ts=1;if(slow>0){slow-=rdt;ts=0.3;}
  if(state==='play'||state==='goal'){acc+=rdt*ts;while(acc>=STEP){step(STEP);acc-=STEP;}}
  render(rdt,state==='menu'||state==='over'?0:rdt*ts);
  requestAnimationFrame(frame);
}
resetKickoff(0);
requestAnimationFrame(frame);
window.__dbg={ball,players,teams,get state(){return state;},doGesture,stick,step,get active(){return active;},get matchT(){return matchT;}};
})();
</script>
